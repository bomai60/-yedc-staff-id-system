<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YEDC Staff ID Card - {{ emp_id }}</title>
    <style>
        @page {
            size: 54mm 86mm;
            margin: 0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica', 'Arial', sans-serif;
        }
        body {
            width: 54mm;
            height: 86mm;
            background-color: #ffffff;
            color: #0f172a;
            overflow: hidden;
        }

        /* Card Header with YEDC Branding */
        .card-header {
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding-top: 2.5mm;
            padding-bottom: 2mm;
            border-bottom: 1.5mm solid #ff6d00; /* YEDC Brand Orange */
        }
        .org-logo {
            max-height: 7mm;
            max-width: 30mm;
        }
        .org-title {
            font-size: 6pt;
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            margin-top: 1mm;
        }
        .org-subtitle {
            font-size: 4pt;
            color: #ff6d00;
            font-weight: bold;
            margin-top: 0.5mm;
            text-transform: uppercase;
        }

        /* Main Content Body */
        .card-body {
            padding-top: 2mm;
            padding-bottom: 1mm;
            text-align: center;
        }

        /* Staff Photo Box */
        .photo-wrapper {
            width: 24mm;
            height: 30mm;
            margin: 0 auto 1.5mm auto;
            border: 1px solid #0f172a;
            background-color: #f8fafc;
        }
        .staff-photo {
            width: 24mm;
            height: 30mm;
        }

        /* Staff Info Elements */
        .staff-name {
            font-size: 8pt;
            font-weight: bold;
            color: #0f172a;
            text-transform: uppercase;
            margin-bottom: 0.8mm;
        }
        .designation {
            font-size: 5.5pt;
            color: #475569;
            margin-bottom: 1mm;
        }
        .emp-id-badge {
            font-size: 6.5pt;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff6d00;
            padding: 0.8mm 2.5mm;
            margin-bottom: 1mm;
            display: inline-block;
        }
        .category-tag {
            font-size: 5pt;
            font-weight: bold;
            text-transform: uppercase;
            color: #0f172a;
            background-color: #e2e8f0;
            padding: 0.5mm 2mm;
            display: inline-block;
        }
        .nysc-badge-img {
            height: 3.5mm;
            vertical-align: middle;
        }

        /* Footer Assets Section (Signature & QR) */
        .card-footer {
            background-color: #f8fafc;
            border-top: 0.5px solid #e2e8f0;
            padding: 1.5mm 3mm;
            height: 16mm;
        }
        .footer-table {
            width: 48mm;
            border-collapse: collapse;
        }
        .sig-col {
            width: 30mm;
            text-align: center;
            vertical-align: middle;
        }
        .qr-col {
            width: 18mm;
            text-align: right;
            vertical-align: middle;
        }
        .sig-img {
            max-width: 26mm;
            max-height: 8mm;
        }
        .sig-label {
            font-size: 3.8pt;
            color: #64748b;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 0.5mm;
        }
        .qr-img {
            width: 11mm;
            height: 11mm;
        }

        /* Bottom Accent Strip */
        .bottom-strip {
            height: 1.5mm;
            background-color: #ff6d00;
            width: 54mm;
        }
    </style>
</head>
<body>
    <!-- YEDC Header -->
    <div class="card-header">
        {% if logo_path %}
        <div>
            <img src="{{ logo_path }}" class="org-logo" alt="YEDC Logo">
        </div>
        {% endif %}
        <div class="org-title">{{ org_name }}</div>
        <div class="org-subtitle">Official Identity Card</div>
    </div>

    <!-- Body -->
    <div class="card-body">
        <div class="photo-wrapper">
            <img src="{{ photo_path }}" class="staff-photo" alt="Staff Photo">
        </div>
        <div class="staff-name">{{ full_name }}</div>
        {% if designation %}
        <div class="designation">{{ designation }}</div>
        {% endif %}
        <div class="emp-id-badge">ID: {{ emp_id }}</div>
        <div>
            <span class="category-tag">
                {% if category == "NYSC" and nysc_logo_path %}
                <img src="{{ nysc_logo_path }}" class="nysc-badge-img" alt="NYSC Logo">
                {% endif %}
                {{ category }}
            </span>
        </div>
    </div>

    <!-- Footer -->
    <div class="card-footer">
        <table class="footer-table">
            <tr>
                <td class="sig-col">
                    <img src="{{ signature_path }}" class="sig-img" alt="Signature">
                    <div class="sig-label">Authorized Signature</div>
                </td>
                <td class="qr-col">
                    <img src="{{ qr_path }}" class="qr-img" alt="QR Code">
                </td>
            </tr>
        </table>
    </div>

    <!-- Accent Strip -->
    <div class="bottom-strip"></div>
</body>
</html>
